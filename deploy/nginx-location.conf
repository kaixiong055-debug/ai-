# Put these locations inside the HTTPS server block for your actual domain.
# In Baota, configure the domain + TLS certificate first. Redirect HTTP to HTTPS.
client_max_body_size 70m;

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}
# Do not expose the application directory, .env, data/ or H2 database using alias/root.
# /media/ is served only by the Java application's validated-file endpoint.
