server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:${CMS_DATA_DIR:./data}/cms;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  thymeleaf:
    cache: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
cms:
  data-dir: ${CMS_DATA_DIR:./data}
  admin:
    username: ${GAME_ADMIN_USERNAME:admin}
    password: ${GAME_ADMIN_PASSWORD:}
  demo:
    enabled: ${CMS_DEMO_ENABLED:false}

# 在此填写 DeepSeek 密钥；修改后重启服务。
deepseek:
  api-key: ""
