<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>登录 · 游选内容管理</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body class="login-body"><main class="login-card"><a class="brand" href="/"><span class="brand-symbol">游</span><span>游选<span class="brand-caption">内容管理工作台</span></span></a><div class="login-heading"><span class="eyebrow">WELCOME BACK</span><h1>让好游戏被看见</h1><p>登录后管理你的游戏、素材与搜索展示。</p></div><p th:if="${param.error}" class="notice error" role="alert">登录失败，请检查账号密码，或稍后重试。</p><p th:if="${param.logout}" class="notice success">你已安全退出。</p><form th:action="@{/login}" method="post" class="login-form"><label>管理员账号<input name="username" id="username" autocomplete="username" required autofocus placeholder="输入管理员账号"></label><label>密码<input name="password" id="password" type="password" autocomplete="current-password" required placeholder="输入密码"></label><button class="button primary" type="submit">登录工作台 <span>→</span></button></form><a href="/" class="login-back">← 返回游戏网站</a></main><div class="login-decoration" aria-hidden="true"><span>发现</span><strong>下一款<br>心动的游戏。</strong><p>真实内容 · 清晰展示 · 独立页面</p><i></i><b></b></div></body></html>
