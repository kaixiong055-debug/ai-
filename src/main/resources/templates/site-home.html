<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title th:text="${seo.title}"></title><meta name="description" th:content="${seo.description}"><meta name="robots" th:content="${seo.robots}"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="canonical" th:if="${!#strings.isEmpty(seo.canonical)}" th:href="${seo.canonical}"><meta property="og:type" content="website"><meta property="og:title" th:content="${seo.title}"><meta property="og:description" th:content="${seo.description}"><meta property="og:site_name" th:content="${settings.siteName}"><meta property="og:url" th:if="${!#strings.isEmpty(seo.canonical)}" th:content="${seo.canonical}"><link rel="stylesheet" href="/site/site.css"><script type="application/ld+json" th:utext="${seo.jsonLd}"></script></head><body class="home-page"><a class="skip" href="#main">跳到正文</a><header class="site-header"><div class="container header-inner"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">游</span><span th:text="${settings.siteName}">游选</span><span class="brand-en">PLAY SOMETHING GOOD</span></a><a class="header-download" href="#games">探索游戏 →</a></div></header><main class="container" id="main"><section class="home-hero"><span class="eyebrow">FIND YOUR NEXT ADVENTURE</span><h1>下一次冒险，<br>从喜欢的游戏开始。</h1><p>先看游戏画面与玩法，再选择是否下载。</p><a class="featured-game" th:if="${featured != null}" th:href="@{/games/{slug}/(slug=${featured.slug})}"><img th:src="${featured.iconUrl}" width="64" height="64" alt=""><span><small>精选推荐 · 点击了解</small><strong th:text="${featured.name}"></strong><span th:text="${featured.summary}"></span></span><b aria-hidden="true">↗</b></a><form class="site-search" method="get" action="/" role="search"><label for="game-search" class="sr-only">搜索游戏</label><input id="game-search" name="q" th:value="${q}" maxlength="120" placeholder="搜索游戏名称或玩法…" type="search"><button class="button primary" type="submit">搜索游戏</button></form></section><section id="games" aria-label="游戏列表"><div class="catalog-heading"><div><span class="eyebrow">EXPLORE THE COLLECTION</span><h2>发现你的下一款游戏</h2><p th:text="${'共 ' + pager.total + ' 款游戏 · 第 ' + pager.page + ' / ' + pager.pages + ' 页'}"></p></div></div><form class="catalog-filters" method="get" action="/#games"><input type="hidden" name="q" th:value="${q}"><label>游戏分类<select name="category"><option value="">全部分类</option><option th:each="c : ${categories}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option></select></label><label>排列方式<select name="sort"><option value="recommended" th:selected="${sort == 'recommended'}">推荐优先</option><option value="latest" th:selected="${sort == 'latest'}">最近更新</option><option value="name" th:selected="${sort == 'name'}">游戏名称</option></select></label><button class="button" type="submit">筛选游戏</button><a href="/#games">重置筛选</a></form><p class="search-result" th:if="${!#strings.isEmpty(q)}"><span th:text="${'“' + q + '” 的搜索结果'}"></span> <a href="/">查看全部游戏</a></p><div class="empty-state" th:if="${#lists.isEmpty(games)}"><h2 th:text="${#strings.isEmpty(q) ? '新的冒险，即将到来' : '暂时没有找到这款游戏'}"></h2><p th:text="${#strings.isEmpty(q) ? '游戏内容正在准备中，欢迎稍后再来看看。' : '试试其他游戏名称或玩法关键词。'}"></p></div><div class="catalog-grid"><article class="home-card" th:each="game : ${games}"><a class="home-card-art" th:href="@{/games/{slug}/(slug=${game.slug})}"><img th:if="${!#strings.isEmpty(game.heroUrl)}" th:src="${game.heroUrl}" width="1008" height="567" th:alt="${game.name + '游戏宣传横幅'}" loading="lazy"></a><div class="catalog-card-body">
<div class="card-identity"><img th:if="${!#strings.isEmpty(game.iconUrl)}" th:src="${game.iconUrl}" width="48" height="48" alt="" loading="lazy"><div><h2><a th:href="@{/games/{slug}/(slug=${game.slug})}" th:text="${game.name}"></a></h2><div class="card-meta"><span th:if="${!#strings.isEmpty(game.category)}" th:text="${game.category}"></span><span th:if="${!#strings.isEmpty(game.platform)}" th:text="${game.platform}"></span><span th:if="${game.recommendationRank > 0}">精选推荐</span></div></div></div>
<p class="edition" th:if="${!#strings.isEmpty(game.subtitle)}" th:text="${game.subtitle}"></p>
<p class="card-summary" th:if="${!#strings.isEmpty(game.summary) or !#strings.isEmpty(game.description)}" th:text="${!#strings.isEmpty(game.summary) ? game.summary : #strings.abbreviate(game.description, 180)}"></p>
<div class="tags" th:if="${!#lists.isEmpty(game.tags)}"><span th:each="tag, stat : ${game.tags}" th:if="${stat.index < 3}" th:text="${tag}"></span></div>
<div class="card-highlight" th:if="${!#lists.isEmpty(game.features)}"><small>玩法亮点</small><strong th:text="${game.features[0].title}"></strong><p th:text="${game.features[0].text}"></p></div>
<a class="card-benefit" th:if="${!#lists.isEmpty(game.benefits)}" th:href="@{/games/{slug}/(slug=${game.slug})}"><span th:text="${game.benefits[0].title}"></span><small>查看福利内容与领取条件 ↗</small></a>
<div class="card-bottom"><span th:if="${!#strings.isEmpty(game.version)}" th:text="${'版本 ' + game.version}"></span><a class="button primary" th:href="@{/games/{slug}/(slug=${game.slug})}">查看详情与下载 →</a></div>
</div></article></div><nav class="catalog-pagination" aria-label="游戏列表分页" th:if="${pager.pages > 1}"><a th:if="${pager.page > 1}" rel="prev" th:href="@{/(q=${q},category=${category},sort=${sort},page=${pager.page - 1})} + '#games'">上一页</a><a th:if="${pager.page > 3}" th:href="@{/(q=${q},category=${category},sort=${sort},page=1)} + '#games'">1 …</a><a th:each="n : ${pageNumbers}" th:href="@{/(q=${q},category=${category},sort=${sort},page=${n})} + '#games'" th:text="${n}" th:attr="aria-current=${n == pager.page ? 'page' : null}"></a><a th:if="${pager.page + 2 < pager.pages}" th:href="@{/(q=${q},category=${category},sort=${sort},page=${pager.pages})} + '#games'" th:text="${'… ' + pager.pages}"></a><a th:if="${pager.page < pager.pages}" rel="next" th:href="@{/(q=${q},category=${category},sort=${sort},page=${pager.page + 1})} + '#games'">下一页</a></nav></section></main><footer class="footer container"><p th:text="${settings.footerText}"></p><p>本站为游戏推广介绍站，含推广链接，非游戏官方。</p><a class="icp-link" th:if="${!#strings.isEmpty(settings.icpNumber)}" href="https://beian.miit.gov.cn/" rel="noopener" target="_blank" th:text="${settings.icpNumber}"></a></footer></body></html>
