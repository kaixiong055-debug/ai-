<!doctype html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title th:text="${seo.title}"></title><meta name="description" th:content="${seo.description}"><meta name="robots" th:content="${seo.robots}"><meta name="referrer" content="strict-origin-when-cross-origin"><link rel="canonical" th:if="${!#strings.isEmpty(seo.canonical)}" th:href="${seo.canonical}"><meta property="og:type" content="website"><meta property="og:title" th:content="${seo.title}"><meta property="og:description" th:content="${seo.description}"><meta property="og:site_name" th:content="${settings.siteName}"><meta property="og:url" th:if="${!#strings.isEmpty(seo.canonical)}" th:content="${seo.canonical}"><link rel="stylesheet" href="/site/site.css"><script type="application/ld+json" th:utext="${seo.jsonLd}"></script></head><body class="home-page"><a class="skip" href="#main">跳到正文</a><header class="site-header"><div class="container header-inner"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">游</span><span th:text="${settings.siteName}">游选</span><span class="brand-en">PLAY SOMETHING GOOD</span></a><a class="header-download" href="#games">探索游戏 →</a></div></header><main class="container" id="main"><section class="home-hero"><span class="eyebrow">FIND YOUR NEXT ADVENTURE</span><h1>下一次冒险，<br>从喜欢的游戏开始。</h1><p>先看游戏画面与玩法，再选择是否下载。</p><form class="site-search" method="get" action="/" role="search"><label for="game-search" class="sr-only">搜索游戏</label><input id="game-search" name="q" th:value="${q}" maxlength="120" placeholder="搜索游戏名称或玩法…" type="search"><button class="button primary" type="submit">搜索游戏</button></form></section><section id="games" aria-label="游戏列表"><p class="search-result" th:if="${!#strings.isEmpty(q)}"><span th:text="${'“' + q + '” 的搜索结果'}"></span> <a href="/">查看全部游戏</a></p><div class="empty-state" th:if="${#lists.isEmpty(games)}"><h2 th:text="${#strings.isEmpty(q) ? '新的冒险，即将到来' : '暂时没有找到这款游戏'}"></h2><p th:text="${#strings.isEmpty(q) ? '游戏内容正在准备中，欢迎稍后再来看看。' : '试试其他游戏名称或玩法关键词。'}"></p></div><article class="home-card" th:each="game : ${games}"><a class="home-card-art" th:href="@{/games/{slug}/(slug=${game.slug})}"><img th:if="${!#strings.isEmpty(game.heroUrl)}" th:src="${game.heroUrl}" width="1008" height="567" th:alt="${game.name + '游戏宣传横幅'}" loading="lazy"></a><div><div class="tags"><span th:each="tag : ${game.tags}" th:text="${tag}"></span></div><h2><a th:href="@{/games/{slug}/(slug=${game.slug})}" th:text="${game.name}"></a></h2><p class="edition" th:text="${game.subtitle}"></p><p th:text="${game.summary}"></p><a class="button primary" th:href="@{/games/{slug}/(slug=${game.slug})}">了解这款游戏 →</a></div></article></section></main><footer class="footer container"><p th:text="${settings.footerText}"></p><p>本站为游戏推广介绍站，含推广链接，非游戏官方。</p><a class="icp-link" th:if="${!#strings.isEmpty(settings.icpNumber)}" href="https://beian.miit.gov.cn/" rel="noopener" target="_blank" th:text="${settings.icpNumber}"></a></footer></body></html>
