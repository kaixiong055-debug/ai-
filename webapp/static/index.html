<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品采集 · 本地工作台</title><link rel="stylesheet" href="/static/style.css"></head><body>
<aside><div class="brand">▦ 商品工作台<small>LOCAL PRODUCT STUDIO</small></div><nav id="nav"></nav><footer><i></i> 本地运行 · 数据保存在电脑</footer></aside>
<main><header><div><div class="eyebrow">电商运营 / 本地管理</div><h1 id="title">商品采集</h1></div><span class="badge">第一版 · 本地工作台</span></header><div id="notice" role="status"></div>
<section id="search" class="panel"><h2>发现商品</h2><p class="muted">输入关键词，复用现有采集程序获取真实商品。平台验证需在浏览器手动完成。</p><form id="searchForm"><label class="grow">搜索关键词<input id="keywords" placeholder="例如：机械键盘, 无线鼠标（逗号或换行分隔）" required></label><label>搜索页数<input id="pages" type="number" value="1" min="1" max="20"></label><div class="platforms"><label><input type="checkbox" name="platform" value="taobao" checked> 淘宝</label><label><input type="checkbox" name="platform" value="xianyu" checked> 闲鱼</label></div><button class="primary" type="submit">开始采集</button></form><div id="progress" aria-live="polite"></div></section>
<section id="products" class="panel"><div class="section-head"><h2>商品列表 <span id="total" class="muted"></span></h2><div><button id="cards">卡片</button><button id="table">表格</button></div></div><div class="image-tabs"><button data-image-filter="">全部图片</button><button data-image-filter="downloaded">已下载</button><button data-image-filter="available">可下载 / 待重试</button><button data-image-filter="failed">下载失败</button><button data-image-filter="unavailable">无图片</button></div><p class="muted">已下载显示本地原图；未下载显示在线缩略预览（不计入已下载）。勾选图片后可下载到商品库，或导出 ZIP 保存到浏览器下载目录。</p><div class="filters"><input id="filter" placeholder="筛选名称、关键词或商品 ID"><select id="platformFilter"><option value="">全部平台</option><option value="taobao">淘宝</option><option value="xianyu">闲鱼</option></select><select id="statusFilter"><option value="">全部下载状态</option><option value="available">可下载（含失败可重试）</option><option value="unavailable">无主图地址</option><option value="pending">待下载</option><option value="downloaded">已下载</option><option value="failed">下载失败</option></select><button id="apply">筛选</button></div><div class="toolbar"><label><input id="selectPage" type="checkbox"> 选择本页</label><span id="selected">已选 0 项</span><button data-action="download">下载选中主图</button><button data-action="retry">重试选中失败图片</button><button data-action="draft">加入待发布</button><button data-action="csv">导出 CSV</button><button data-action="zip">导出 ZIP</button><button data-action="delete" class="danger">删除记录</button></div><div id="listing"></div><div class="pagination"><button id="prev">上一页</button><span id="pageLabel"></span><button id="next">下一页</button></div><p class="muted">仅提供搜索主图。SKU 图、详情图：待支持。ZIP 包含已下载图片及 CSV；删除记录保留已下载文件和独立草稿。</p></section>
<section id="other" hidden></section></main>
<dialog id="productDetail" aria-label="商品详情"><div class="section-head"><h2>商品详情</h2><button id="closeDetail">关闭详情</button></div><div id="detailBody"></div></dialog><dialog id="editor"><form id="draftForm"><div class="section-head"><h2>编辑商品草稿</h2><button type="button" id="closeEditor">关闭</button></div><label>标题<input name="title" required maxlength="200"></label><label>描述<textarea name="description" rows="3"></textarea></label><div class="filters"><label>售价<input name="price" type="number" min="0" step="0.01"></label><label>库存<input name="stock" type="number" min="0"></label><label>分类<input name="category"></label></div><label>图片路径（一行一项）<textarea name="images" rows="2"></textarea></label><label>SKU（JSON 数组，未知时保留 []）<textarea name="sku" rows="2"></textarea></label><label>物流（JSON 对象）<textarea name="logistics" rows="2"></textarea></label><label>平台专属字段（JSON 对象）<textarea name="platform_fields" rows="2"></textarea></label><div class="platforms"><label><input type="checkbox" name="target" value="taobao">淘宝</label><label><input type="checkbox" name="target" value="xianyu">闲鱼</label><label><input type="checkbox" name="target" value="xiaohongshu">小红书</label></div><p class="muted">保存草稿不会发布商品。真实上架暂不支持。</p><button class="primary">保存草稿</button></form></dialog><script src="/static/app.js" defer></script></body></html>
